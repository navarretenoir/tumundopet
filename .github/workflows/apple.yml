# Compila TuMundoPet para macOS (universal) e iOS en un Mac de GitHub (sin firma: para probar; firmar requiere cuenta de Apple).
name: TuMundoPet Apple
on: [workflow_dispatch, push]
jobs:
  compilar:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install xcodegen
      - run: ./preparar-web.sh && xcodegen generate
      - run: xcodebuild -project TuMundoPet.xcodeproj -scheme TuMundoPet-macOS -configuration Release -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO build SYMROOT=$PWD/build
      - run: xcodebuild -project TuMundoPet.xcodeproj -scheme TuMundoPet-iOS -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build SYMROOT=$PWD/build
      - run: lipo -info "build/Release/TuMundoPet.app/Contents/MacOS/TuMundoPet"
      - uses: actions/upload-artifact@v4
        with: { name: TuMundoPet-apple, path: "apple/build/Release*/*.app" }
