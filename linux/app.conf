# Tu Mundo Pet — configuración de empaquetado Linux (la usa "$(git rev-parse --show-toplevel)/herramientas"/linux-pkg/empaquetar.sh)
APP_ID=io.github.navarretenoir.TuMundoPet
PAQUETE=tumundopet
NOMBRE="Tu Mundo Pet"
NOMBRE_ARCHIVO=TuMundoPet
VERSION=$(cat "$APP/VERSION")
BIN_GUI=tumundopet
RESUMEN="Tienda Tu Mundo Pet: acuarismo y productos premium de mascotas"
DESCRIPCION="La tienda Tu Mundo Pet en su propia ventana: catálogo, carrito y compra con las pasarelas chilenas. El carrito y la sesión se conservan; WhatsApp y redes se abren en el navegador."
DEPS_RPM="gtk4, webkitgtk6.0"
DEPS_DEB="libgtk-4-1, libwebkitgtk-6.0-4"
FLATPAK_EXTRA=""
SNAP_EXTRA=""
compilar() {
  local pre=$1 out=$2 w; w=$(mktemp -d)
  cp -a "$APP/desktop/." "$w/"; rm -f "$w/tumundopet"
  make -s -C "$w" >/dev/null; strip "$w/tumundopet"; cp "$w/tumundopet" "$out/"
  rm -rf "$w"
}
instalar() { install -Dm755 "$3/tumundopet" "$1$2/bin/tumundopet"; }
appimage_entorno() { echo ':'; }
